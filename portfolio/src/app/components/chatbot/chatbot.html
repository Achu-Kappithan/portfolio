<!-- Chatbot Trigger Button -->
<button class="chatbot-trigger" (click)="toggleChat()" [class.active]="isOpen()" aria-label="Open career assistant chat">
  <div class="trigger-icon-container">
    @if (!isOpen()) {
      <!-- Chat bubble icon -->
      <svg class="trigger-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
      <span class="pulse-badge"></span>
    } @else {
      <!-- Close (X) icon -->
      <svg class="trigger-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    }
  </div>
</button>

<!-- Chat Window -->
<div class="chatbot-window glass-card" [class.open]="isOpen()">
  <!-- Header -->
  <div class="chat-header">
    <div class="avatar-container">
      <div class="avatar-glow"></div>
      <div class="avatar">
        <!-- Default AI face avatar -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="ai-avatar-icon">
          <path d="M12 2a5 5 0 0 1 5 5v1h2a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2v1a5 5 0 0 1-5 5H12a5 5 0 0 1-5-5v-1H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v2h6V7a3 3 0 0 0-3-3zM9 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm6 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-3-9c-3.87 0-7 3.13-7 7 0 1.94.79 3.69 2.06 4.96A9.92 9.92 0 0 1 5 18a1 1 0 1 0 2 0c0 2.21 1.79 4 4 4h2c2.21 0 4-1.79 4-4a1 1 0 1 0 2 0c0 .72-.08 1.43-.24 2.11A6.98 6.98 0 0 0 19 11c0-3.87-3.13-7-7-7z"/>
        </svg>
      </div>
      <span class="status-indicator"></span>
    </div>
    <div class="chat-title-info">
      <h3>Achu's AI Copilot</h3>
      <p>Answers recruiters instantly • Active</p>
    </div>
    <button class="close-btn" (click)="toggleChat()" aria-label="Close chat window">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Messages Body -->
  <div class="chat-messages" #scrollContainer>
    @for (msg of chatService.messages(); track msg.timestamp) {
      <div class="message-wrapper" [class.user-message]="msg.role === 'user'" [class.assistant-message]="msg.role === 'assistant'">
        @if (msg.role === 'assistant') {
          <div class="message-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="inline-avatar-svg">
              <path d="M12 2a5 5 0 0 1 5 5v1h2a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2v1a5 5 0 0 1-5 5H12a5 5 0 0 1-5-5v-1H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v2h6V7a3 3 0 0 0-3-3zM9 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm6 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-3-9c-3.87 0-7 3.13-7 7 0 1.94.79 3.69 2.06 4.96A9.92 9.92 0 0 1 5 18a1 1 0 1 0 2 0c0 2.21 1.79 4 4 4h2c2.21 0 4-1.79 4-4a1 1 0 1 0 2 0c0 .72-.08 1.43-.24 2.11A6.98 6.98 0 0 0 19 11c0-3.87-3.13-7-7-7z"/>
            </svg>
          </div>
        }
        <div class="message-bubble" [innerHTML]="formatMessage(msg.content)"></div>
      </div>
    }

    <!-- Typing Indicator -->
    @if (chatService.isTyping()) {
      <div class="message-wrapper assistant-message">
        <div class="message-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="inline-avatar-svg">
            <path d="M12 2a5 5 0 0 1 5 5v1h2a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2v1a5 5 0 0 1-5 5H12a5 5 0 0 1-5-5v-1H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v2h6V7a3 3 0 0 0-3-3zM9 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm6 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-3-9c-3.87 0-7 3.13-7 7 0 1.94.79 3.69 2.06 4.96A9.92 9.92 0 0 1 5 18a1 1 0 1 0 2 0c0 2.21 1.79 4 4 4h2c2.21 0 4-1.79 4-4a1 1 0 1 0 2 0c0 .72-.08 1.43-.24 2.11A6.98 6.98 0 0 0 19 11c0-3.87-3.13-7-7-7z"/>
          </svg>
        </div>
        <div class="message-bubble typing-bubble">
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Suggested Actions -->
  <div class="chat-suggestions">
    @for (sug of suggestions; track sug) {
      <button class="suggestion-chip" (click)="sendSuggestion(sug)" [disabled]="chatService.isTyping()">
        {{ sug }}
      </button>
    }
  </div>

  <!-- Chat Input Footer -->
  <div class="chat-footer">
    <input 
      type="text" 
      [ngModel]="userMessage()" 
      (ngModelChange)="userMessage.set($event)"
      (keyup.enter)="sendMessage()" 
      placeholder="Ask about projects, skills..." 
      [disabled]="chatService.isTyping()"
      aria-label="Chat input message"
    />
    <button class="send-btn" (click)="sendMessage()" [disabled]="!userMessage().trim() || chatService.isTyping()" aria-label="Send message">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="send-icon">
        <path d="M3.4 22a.79.79 0 0 1-.74-.78.85.85 0 0 1 .15-.5L5.7 13.5a1 1 0 0 1 .9-.5h10.9a.5.5 0 0 0 0-1H6.6a1 1 0 0 1-.9-.5L2.81 4.28a.85.85 0 0 1-.15-.5.79.79 0 0 1 .74-.78c.11 0 .22.02.32.07l18 8.6a.79.79 0 0 1 0 1.46l-18 8.6a1 1 0 0 1-.32.07z"/>
      </svg>
    </button>
  </div>
</div>
